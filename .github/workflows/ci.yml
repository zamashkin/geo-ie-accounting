name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Warms the pnpm store cache once; the parallel jobs below restore it.
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

  typecheck:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck

  lint:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint
      - run: pnpm format:check

  unit:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test

  integration:
    needs: install
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Each test file creates and drops its own database on this server (packages/db/src/testing).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  openapi-drift:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm gen:api
      - name: Committed OpenAPI spec and web client types are current
        run: |
          git status --porcelain -- apps/api/openapi.json apps/web/src/lib/api
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api

  migration-check:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @geo-ie-accounting/db db:check
      - run: pnpm db:generate
      - name: Schema and committed migrations agree
        run: |
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --porcelain -- packages/db/drizzle
            echo "::error::Drizzle schema changed without a migration. Run pnpm db:generate and commit it."
            exit 1
          fi

  build:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build

  # Every story as a test in headless Chromium: render, play function, axe (packages/ui).
  storybook:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @geo-ie-accounting/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @geo-ie-accounting/ui build-storybook
      - run: pnpm --filter @geo-ie-accounting/ui test:storybook

  # Playwright against the production builds of web and api, with compose Postgres and Mailpit.
  # `pnpm db:seed` stores the NBG rates the statement fixtures need, so nothing calls NBG.
  e2e:
    needs: install
    runs-on: ubuntu-24.04
    env:
      LOG_PRETTY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Start services
        run: docker compose up -d --wait postgres mailpit
      # Before the build: NEXT_PUBLIC_* from apps/web/.env is inlined into the web bundle.
      - run: pnpm env:init
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm turbo run build --filter=@geo-ie-accounting/api --filter=@geo-ie-accounting/web
      - run: pnpm --filter @geo-ie-accounting/web exec playwright install --with-deps chromium
      - name: Start api and web
        run: |
          pnpm --filter @geo-ie-accounting/api start > api.log 2>&1 &
          pnpm --filter @geo-ie-accounting/web start > web.log 2>&1 &
          timeout 60 sh -c 'until curl -fs http://localhost:4000/healthz && curl -fs http://localhost:3000/sign-in; do sleep 1; done' > /dev/null
      - run: pnpm e2e
      - name: Server logs
        if: failure()
        run: tail -n 200 api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: apps/web/e2e/.results
          retention-days: 7
      - if: always()
        run: docker compose down -v
