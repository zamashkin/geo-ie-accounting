packages:
  - apps/*
  - packages/*
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/browser-playwright@5.0.5'
  - '@vitest/browser@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
# Patched versions of transitive dependencies whose parents still resolve a vulnerable one.
overrides:
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # @esbuild-kit (drizzle-kit's config loader) pins 0.18; GHSA-67mh-4wv8-2f99.
  'esbuild@<=0.24.2': 0.25.12
