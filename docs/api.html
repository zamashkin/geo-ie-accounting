<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>geo-ie-accounting API</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui.css">
<style>
  body { margin: 0; background: #fff; }
  .note { font: 14px/1.5 system-ui, sans-serif; padding: 12px 16px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; }
  .note code { font-size: 13px; }
</style>
</head>
<body>
<p class="note">
  Read-only reference generated from the Zod contracts (<code>apps/api/openapi.json</code> on <code>main</code>).
  To try requests, run the API locally and open <code>http://localhost:4000/docs</code>.
</p>
<div id="swagger"></div>
<script>
  // The bundle is loaded from here rather than with a <script src> tag: htmlpreview.github.io
  // runs inline scripts before external ones have loaded. The absolute spec URL works there
  // and when the file is opened locally.
  var bundle = document.createElement('script');
  bundle.src = 'https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.3/swagger-ui-bundle.js';
  bundle.crossOrigin = 'anonymous';
  bundle.onload = function () {
    window.ui = SwaggerUIBundle({
      url: 'https://raw.githubusercontent.com/zamashkin/geo-ie-accounting/main/apps/api/openapi.json',
      dom_id: '#swagger',
      deepLinking: true,
      docExpansion: 'none',
      defaultModelsExpandDepth: 0,
      supportedSubmitMethods: [],
    });
  };
  document.head.appendChild(bundle);
</script>
</body>
</html>
